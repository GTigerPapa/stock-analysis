[project]
name = "stockan"
version = "0.1.0"
description = "국내 주식 일일 정량분석 파이프라인 (KRX+NXT)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "finance-datareader>=0.9.90",
    "lxml>=4.9",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
